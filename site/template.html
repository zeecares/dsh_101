<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$if(title)$$title$ — $endif$dsh_101</title>
<style>
:root {
  --bg: #ffffff; --fg: #1a1d21; --muted: #5b6470;
  --accent: #4d6bfe; --border: #e3e6ea;
  --code-bg: #f4f5f7; --quote-bg: #f7f8fa;
  --link: #2b4fd8; --toc-bg: #fafbfc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181d; --fg: #e6e8eb; --muted: #9aa3ae;
    --accent: #7d97ff; --border: #2a2f38;
    --code-bg: #1f232b; --quote-bg: #1d2129;
    --link: #8aa5ff; --toc-bg: #1b1f26;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size: 17px; line-height: 1.65;
}
header.site {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 10px 18px; display: flex; align-items: baseline; gap: 10px;
}
header.site .brand { font-weight: 700; color: var(--accent); text-decoration: none; font-size: 15px; }
header.site .tag  { color: var(--muted); font-size: 13px; }
main { max-width: 46rem; margin: 0 auto; padding: 8px 18px 64px; }
h1 { font-size: 1.7em; line-height: 1.25; margin: 1.2em 0 .5em; }
h1 + p, h2 + p { color: var(--muted); }
h2 { font-size: 1.32em; margin: 1.8em 0 .5em; padding-top: .4em; border-top: 1px solid var(--border); }
h3 { font-size: 1.12em; margin: 1.5em 0 .4em; }
p { margin: .8em 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em;
  background: var(--code-bg); border-radius: 4px; padding: .1em .35em; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; overflow-x: auto; font-size: .86em; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: 1em; }
blockquote { margin: 1em 0; padding: .2em 1em; border-left: 3px solid var(--accent);
  background: var(--quote-bg); border-radius: 0 8px 8px 0; color: var(--fg); }
blockquote p { margin: .5em 0; }
table { display: block; overflow-x: auto; border-collapse: collapse; margin: 1.2em 0;
  font-size: .92em; max-width: 100%; }
th, td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--toc-bg); font-weight: 600; white-space: nowrap; }
tr:nth-child(even) td { background: var(--toc-bg); }
ul, ol { padding-left: 1.4em; }
li { margin: .35em 0; }
details.toc { margin: 14px 0 6px; background: var(--toc-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 14px; }
details.toc summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: .95em; user-select: none; }
details.toc nav#TOC { margin: 6px 0 8px; font-size: .9em; max-height: 60vh; overflow-y: auto; }
details.toc nav#TOC ul { list-style: none; padding-left: .8em; margin: .3em 0; }
details.toc nav#TOC > ul { padding-left: 0; }
details.toc nav#TOC li { margin: .25em 0; }
details.toc nav#TOC a { color: var(--fg); }
details.toc nav#TOC a:hover { color: var(--link); }
hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
footer.site { max-width: 46rem; margin: 0 auto; padding: 0 18px 48px; color: var(--muted);
  font-size: .85em; border-top: 1px solid var(--border); padding-top: 14px; }
img { max-width: 100%; height: auto; }
mark { background: #fff3b0; }
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="./">dsh_101</a>
  <span class="tag">From Claude Code to DeepSeek Harness — what is a plugin</span>
</header>
<main>
$if(toc)$
<details class="toc" open>
  <summary>Contents</summary>
  $toc$
</details>
$endif$
$body$
</main>
<footer class="site">
  dsh_101 · tutorial researched against primary sources (deepseek-ai/deepseek-harness, earendil-works/pi, code.claude.com).
  Source: <a href="https://github.com/zeecares/dsh_101">github.com/zeecares/dsh_101</a>
</footer>
</body>
</html>
